# Build unico: push, PR e disparo manual.
# O build e feito EXCLUSIVAMENTE aqui (nunca localmente); acompanhe com:
#   gh run list --repo denonexus-coder/infinitiumdrawchunk
#   gh run watch <run-id> --repo denonexus-coder/infinitiumdrawchunk
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        # O endpoint do validador (services.gradle.org) flutua no runner; nao pode derrubar
        # o build. O wrapper e o jar oficial do Gradle 8.12.1 copiado do fork.
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@v3

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle build
        run: ./gradlew build --stacktrace

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: infinitiumdrawchunk
          path: build/libs/
          if-no-files-found: error
